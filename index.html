<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPG11 Journey Tracker — Track Every Step of Your SPG11 Journey</title>
    <meta
      name="description"
      content="A simple and meaningful platform to document your SPG11 journey, organize milestones, save memories, write private journal entries, and monitor your progress."
    />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SPG11 Tracker" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SPG11 Journey Tracker — Track Every Step of Your SPG11 Journey" />
    <meta
      property="og:description"
      content="A simple and meaningful platform to document your journey, organize milestones, save memories, and monitor your progress."
    />
    <meta property="og:site_name" content="SPG11 Journey Tracker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SPG11 Journey Tracker" />
    <meta
      name="twitter:description"
      content="A simple and meaningful platform to document your journey, organize milestones, save memories, and monitor your progress."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('spg11_theme_preference');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
